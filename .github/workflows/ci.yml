name: CI / Publicação NuGet

# Fluxo:
#   pull_request na main  -> build + testes + cobertura (não publica)
#   push na main          -> build + testes + publica prévia X.Y.(Z+1)-preview.N
#   release publicado     -> build + testes + publica versão estável da tag (vX.Y.Z -> X.Y.Z)
#   workflow_call         -> chamado pelo release.yml com a versão digitada: só build + testes + pacote.
#                            Quem publica é o próprio release.yml, depois de criar a tag e o Release
#                            (assim uma falha na criação da tag nunca deixa um pacote órfão no feed).
on:
  workflow_call:
    inputs:
      version:
        description: "Versão a gerar (build, testes e pacote), ex.: 1.2.0"
        type: string
        required: true
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: TEC.Core/TEC.Core.csproj
  SOLUTION: TEC.Core.slnx
  NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build:
    name: Build, testes e pacote
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico e tags para calcular a versão e para o SourceLink
          persist-credentials: false   # o token não fica no .git/config enquanto build e testes executam

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json   # SDK fixado no global.json (mesmo do desenvolvimento local)
          # Runtime do .NET 8 (LTS) para rodar os testes do alvo net8.0; o build continua com o SDK do global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Calcular versão
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            if ! [[ "$VERSION" =~ $SEMVER ]]; then
              echo "::error::A versão '$VERSION' não segue o padrão X.Y.Z (SemVer)."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if ! [[ "$VERSION" =~ $SEMVER ]]; then
              echo "::error::A tag '$TAG' não segue o padrão vX.Y.Z (SemVer)."
              exit 1
            fi
            # Versão estável só a partir de commit que já está na main (um Release pode apontar para qualquer branch)
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::A tag '$TAG' aponta para um commit fora da main."
              exit 1
            fi
          else
            # Última tag estável (ignora pré-releases como v1.2.0-rc.1)
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              # --match é um glob (aceitaria "v1.2.3x"): a tag é conferida ANTES da conta abaixo, porque a expansão
              # aritmética do bash avalia o conteúdo das variáveis
              if ! [[ "$LAST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::A última tag estável encontrada não segue o padrão vX.Y.Z; corrija ou apague a tag."
                exit 1
              fi
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
              BASE="$MAJOR.$MINOR.$((10#$PATCH + 1))"
            else
              # Sem tags ainda: usa o <Version> do csproj como base
              BASE=$(dotnet msbuild "$PROJECT" -getProperty:Version)
            fi
            VERSION="$BASE-preview.$GITHUB_RUN_NUMBER"
          fi

          # Vale para todos os ramos: a base da prévia vem de uma tag (o --match é glob, não regex) ou do csproj
          if ! [[ "$VERSION" =~ $SEMVER ]]; then
            echo "::error::A versão calculada não segue o padrão X.Y.Z (SemVer)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 📦 Versão: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore (lock file obrigatório)
        run: dotnet restore "$SOLUTION" --locked-mode

      # A versão chega por variável de ambiente: valores interpolados com ${{ }} dentro de "run" viram texto do script
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build "$SOLUTION" -c Release --no-restore "-p:Version=$VERSION"

      # Roda os testes em net8.0 e net10.0 (TargetFrameworks do projeto de testes).
      # O .trx usa o nome padrão (único por execução): um nome fixo faria o net10.0 sobrescrever o net8.0.
      - name: Testes + cobertura
        run: >
          dotnet test --solution "$SOLUTION" -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory ./coverage
          --report-trx

      - name: Testes sem ICU (InvariantGlobalization)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        run: dotnet test --solution "$SOLUTION" -c Release --no-build

      # Só com cobertura gerada: se o restore, o build ou os testes falharem antes, o erro exibido é o deles
      - name: Relatório de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@c31aa4ed4f12f147061186cf2a029f307b5c3636 # v5.5.9
        with:
          reports: coverage/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub
          title: TEC.Core

      - name: Publicar resumo da cobertura
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload cobertura e resultados de teste
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: |
            coverage-report/
            coverage/**/*.trx
          retention-days: 14

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack "$PROJECT" -c Release --no-build "-p:Version=$VERSION" -o ./artifacts

      - name: Upload pacotes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: artifacts/*
          retention-days: 14

  publish:
    name: Publicar no GitHub Packages
    needs: build
    # workflow_call (release.yml) não publica aqui: o release.yml cria a tag/Release primeiro e depois publica
    if: >
      inputs.version == '' &&
      (github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      packages: write   # push no feed NuGet do GitHub
      contents: write   # anexar os pacotes ao Release

    steps:
      - name: Download pacotes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # O GitHub Packages não aceita .snupkg; os símbolos vão anexados ao Release
      - name: Push no GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "$NUGET_FEED"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
          --no-symbols

      - name: Anexar pacotes ao Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"

      - name: Resumo
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "### ✅ TEC.Core \`$VERSION\` publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Feed: \`$NUGET_FEED\`" >> "$GITHUB_STEP_SUMMARY"
