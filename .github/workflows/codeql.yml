name: CodeQL

# Análise estática de segurança (SAST) do código C#.
# Os alertas aparecem em Security -> Code scanning. Modo "none" (sem build): não depende do restore nem do feed interno.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # segunda-feira, 06:00 UTC (detecta consultas novas mesmo sem commits)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analisar:
    name: Analisar (C#)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # enviar os resultados para o Code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:csharp
