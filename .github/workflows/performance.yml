name: Performance

# Suítes pesadas e de carga: só sob demanda (Actions -> Performance -> Run workflow). Não rodam no PR nem na publicação.
#   rapida     -> TEC.Core.LoadTests [Carga-CI]: carga curta com limites folgados (input suite = rapida ou todas)
#   carga      -> TEC.Core.LoadTests [Carga-Pesada]: volume de CSV e AES-GCM, soak e carga sustentada na API de exemplo
#   seguranca  -> TEC.Core.Tests [Seguranca-Pesada]: canais laterais de tempo (teste t de Welch)
#   benchmarks -> TEC.Core.Benchmarks (BenchmarkDotNet, net8.0 x net10.0), só no disparo manual
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suítes de carga: pesadas (Carga-Pesada e Seguranca-Pesada), rapida (Carga-CI) ou todas"
        type: choice
        options: [pesadas, rapida, todas]
        default: pesadas
      soak_segundos:
        description: "Duração do soak em processo (segundos)"
        type: number
        default: 600
      api_segundos:
        description: "Duração da carga sustentada na API de exemplo (segundos)"
        type: number
        default: 120
      csv_linhas:
        description: "Linhas do teste de volume de CSV"
        type: number
        default: 2000000
      aes_mb:
        description: "Megabytes do teste de volume do AES-GCM em stream"
        type: number
        default: 1024
      benchmarks:
        description: "Rodar também os benchmarks"
        type: boolean
        default: false
      benchmark_filtro:
        description: "Filtro do BenchmarkDotNet (ex.: *Csv*; * = todos)"
        type: string
        default: "*"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rapida:
    if: inputs.suite != 'pesadas'
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      name: carga rápida
      tests: TEC.Core.LoadTests /*/*/*/*[Category=Carga-CI]
      artifact: carga

  pesados:
    if: inputs.suite != 'rapida'
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      name: suítes pesadas
      tests: |
        TEC.Core.LoadTests /*/*/*/*[Category=Carga-Pesada]
        TEC.Core.Tests /*/*/*/*[Category=Seguranca-Pesada]
      env: |
        TEC_CARGA_SOAK_SEGUNDOS=${{ inputs.soak_segundos || 600 }}
        TEC_CARGA_API_SEGUNDOS=${{ inputs.api_segundos || 120 }}
        TEC_CARGA_CSV_LINHAS=${{ inputs.csv_linhas || 2000000 }}
        TEC_CARGA_AES_MB=${{ inputs.aes_mb || 1024 }}
      artifact: pesados
      timeout-minutes: 120

  benchmarks:
    if: inputs.benchmarks
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-benchmark.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      project: TEC.Core.Benchmarks
      filter: ${{ inputs.benchmark_filtro }}
